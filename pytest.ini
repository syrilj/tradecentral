[pytest]
# `..` (the checkout's parent directory) must be on sys.path, not just `.`.
# The whole suite writes absolute imports like `from edge.research.optimizer
# import ...`, which only resolve if a directory literally named `edge` (this
# repo) is reachable as a top-level package from something on sys.path. `.`
# alone (the old setting) put *this* directory on sys.path, which is enough
# for `import research.optimizer` but not `import edge.research.optimizer`.
#
# On a contributor's machine this often "worked anyway" by accident: pytest's
# rootdir-package auto-insertion kicks in when the whole chain from a test
# file's directory up through `tests/` up through the repo root carries
# `__init__.py`, OR (the trap) when a *stale* `tests/__pycache__/__init__.*
# .pyc` is left over from a previously-deleted `tests/__init__.py` -- CPython
# treats a directory with only compiled bytecode as an importable package.
# Neither holds on a clean checkout (tests/, tests/daily_plays/,
# tests/research/, tests/tools/ have no `__init__.py`, and CI has no stale
# __pycache__), so CI must not depend on that accident. Explicitly adding the
# parent directory here makes `edge.*` imports resolve deterministically
# provided the checkout directory is literally named `edge` -- see the
# `path: edge` on the checkout step in .github/workflows/ci.yml.
pythonpath = . ..
testpaths = tests
markers =
    needs_market_data_files: requires real OHLCV parquet files under data/1d/ (gitignored, not present in a fresh checkout) rather than synthetic fixtures. Deselected in CI; see conftest.py for the exact test list and per-test justification.
    needs_live_network: makes an uncontrolled live call to a real market-data provider (e.g. yfinance) with no fixture/mock seam, so results depend on the current date or on that provider's live response. Deselected in CI; see conftest.py for the exact test list and per-test justification.

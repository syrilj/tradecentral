name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - name: Archive dashboard distribution
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: runs/dashboard_dist
          retention-days: 1

  cloudflare-worker:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Cloudflare Worker unit tests
        run: node --test cloudflare/worker.test.mjs
      - name: Download dashboard distribution
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: runs/dashboard_dist
      - name: Validate Cloudflare Worker packaging
        run: npx wrangler deploy --dry-run -c cloudflare/wrangler.toml
      - name: Deploy dev site to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deploying dev site preview to Cloudflare Workers..."
            npx wrangler deploy -c cloudflare/wrangler.toml
          else
            echo "CLOUDFLARE_API_TOKEN is not configured in repository secrets."
            echo "Dev site bundle and Worker configuration were verified via dry-run."
          fi

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Checked out to a subdirectory literally named `edge` (see the
        # checkout step below) rather than $GITHUB_WORKSPACE directly. The
        # whole tests/ suite uses absolute imports like
        # `from edge.research.optimizer import ...`, which only resolve if a
        # directory named `edge` sits under something on sys.path -- see the
        # `pythonpath = . ..` comment in pytest.ini for the full story.
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
        with:
          path: edge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ruff
      - run: ruff check .
      - run: pip install -r requirements-eval.txt
      - run: python -m pytest eval -q
      - run: pip install -r requirements-ci.txt
      # Runs the largest subset of tests/ that passes deterministically in a
      # fresh checkout (measured: 1443 of 1449 collected tests). The 6
      # deselected here need real market-data parquet files that are
      # gitignored (data/ is not checked out) or make uncontrolled live
      # network calls with no mock seam and so drift with real-world data;
      # see conftest.py at the repo root for the exact test list and the
      # reasoning for each one, and pytest.ini for the marker definitions.
      - run: python -m pytest tests -q -m "not needs_market_data_files and not needs_live_network"
